[package]
name = "charge-guard"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "OPLUS thermal control with independent maintained backends"

[features]
fixtures = []

[dependencies]
libc = "=0.2.172"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
