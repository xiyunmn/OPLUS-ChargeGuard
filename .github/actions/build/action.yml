name: Build Android module
description: Build a directly downloadable ARM64 module installation ZIP
inputs:
  channel:
    description: beta or release
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Resolve build version
      id: version
      shell: bash
      env:
        CG_CHANNEL: ${{ inputs.channel }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python tools/ci.py "$CG_CHANNEL"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install Android toolchain
      shell: bash
      run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.3.13750724'
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup toolchain install 1.85.1 --profile minimal --target aarch64-linux-android
    - name: Check source and JavaScript syntax
      shell: bash
      run: |
        python tools/build.py audit
        for file in module/webroot/*.js; do node --check "$file"; done
        cargo test --locked --lib --features fixtures
    - name: Build and validate installation ZIP
      shell: bash
      env:
        CG_CHANNEL: ${{ inputs.channel }}
        CG_BETA_NUMBER: ${{ steps.version.outputs.beta_number }}
      run: |
        args=(--channel "$CG_CHANNEL" --installation-only)
        if [[ "$CG_CHANNEL" == beta ]]; then args+=(--beta-number "$CG_BETA_NUMBER"); fi
        python tools/build.py build "${args[@]}" --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
    - name: Upload module ZIP without an outer archive
      uses: actions/upload-artifact@v7
      with:
        path: target/dist/${{ steps.version.outputs.filename }}
        archive: false
        overwrite: true
        if-no-files-found: error
        retention-days: 30
