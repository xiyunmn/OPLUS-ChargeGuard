name: Build Android module
description: Build ARM64 installation and source ZIPs from locked inputs
inputs:
  channel:
    description: beta or release
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install Android toolchain
      shell: bash
      run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.3.13750724'
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup toolchain install 1.85.1 --profile minimal --target aarch64-linux-android
    - name: Check source and JavaScript syntax
      shell: bash
      run: |
        python tools/build.py audit
        for file in module/webroot/*.js; do node --check "$file"; done
        cargo test --locked --lib --features fixtures
    - name: Build and validate packages
      shell: bash
      env:
        CG_CHANNEL: ${{ inputs.channel }}
      run: python tools/build.py build --channel "$CG_CHANNEL" --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
    - name: Upload installation and source ZIPs
      uses: actions/upload-artifact@v4
      with:
        name: charge_guard-${{ inputs.channel }}-${{ github.run_number }}
        path: target/dist/*.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
